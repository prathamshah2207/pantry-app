<!DOCTYPE html>
<html>
<head>
	<title>Create Profile</title>
	<link rel="stylesheet" href="userpage.css">
</head>
<body>
	<div class="page-shell">
		<div class="auth-shell">
			<div class="auth-content">
				<div class="top-tag">Pantry • Recipes • Nutrition</div>

				<h1 class="page-title">Create Profile</h1>
				<p class="page-subtext">
					Set up your account and basic food preferences in one place.
				</p>

				<form id="signupForm" class="form-grid">
					<div class="field-group">
						<label for="name" class="field-label">Display Name</label>
						<input type="text" id="name" required>
					</div>

					<div class="field-group">
						<label for="username" class="field-label">Username</label>
						<input type="text" id="username" required>
					</div>

					<div class="field-group">
						<label for="email" class="field-label">Email</label>
						<input type="email" id="email">
					</div>

					<div class="field-group">
						<label for="password" class="field-label">Password</label>
						<input type="password" id="password" required>
					</div>

					<div class="field-group">
						<label for="dietPreference" class="field-label">Diet Preference</label>
						<select id="dietPreference">
							<option value="none">None</option>
							<option value="vegetarian">Vegetarian</option>
							<option value="vegan">Vegan</option>
							<option value="halal">Halal</option>
							<option value="gluten-free">Gluten-Free</option>
						</select>
					</div>

					<label class="checkbox-row">
						<input type="checkbox" id="allowSubstitutions" checked>
						<span>Allow ingredient substitutions</span>
					</label>

					<div class="form-actions">
						<button type="submit">Create Profile</button>
					</div>
				</form>

				<p class="auth-switch">
					Already have an account? <a href="login.html">Login</a>
				</p>

				<p id="message"></p>
			</div>
		</div>
	</div>

	<script>
		async function checkUser() {
			try {
				const resp = await fetch("/user");
				const data = await resp.json();
				if (data.exists)
					window.location.replace('/');
			}
			catch (err){
				console.error("Error checkin user: ", err);
			}
		}
		checkUser();

		const signupForm = document.getElementById("signupForm");
		const message = document.getElementById("message");

		signupForm.addEventListener("submit", async function(event) {
			event.preventDefault();

			const userData = {
				name: document.getElementById("name").value,
				username: document.getElementById("username").value,
				email: document.getElementById("email").value,
				password: document.getElementById("password").value,
				dietPreference: document.getElementById("dietPreference").value,
				allowSubstitutions: document.getElementById("allowSubstitutions").checked
			};

			try {
				const response = await fetch("/signup", {
					method: "POST",
					headers: {
						"Content-Type": "application/json"
					},
					body: JSON.stringify(userData)
				});

				const data = await response.json();

				if (response.ok) {
					message.textContent = data.message;
					window.location.href = "user_profile.html";
				}
				else {
					message.textContent = data.message;
				}
			}
			catch (err) {
				message.textContent = "Error creating profile.";
				console.error(err);
			}
		});
	</script>
</body>
</html>
