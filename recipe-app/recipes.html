<!DOCTYPE html>
<html>
<head>
<title>Saved Recipes</title>
<link rel="stylesheet" href="recipepage.css">
</head>
<body>
	<div class="page-shell">
		<div class="app-shell">
			<header class="top-nav">
				<div class="brand">
					<h1 class="brand-title">Pantry &amp; Recipe App</h1>
					<div class="brand-subtitle">Recipes • Saved • Preferences</div>
				</div>

				<nav class="nav-links">
					<button type="button" class="nav-btn" onclick="window.location.href='recipe_page.html'">Build Recipe</button>
					<button type="button" class="nav-btn" onclick="window.location.href='/'">Home</button>
				</nav>
			</header>

			<main class="content">
				<section class="hero">
					<h1>Saved Recipes</h1>
					<p>
						Browse saved recipes and check calories
					</p>
				</section>

				<section class="panel">
					<h2 class="section-title">Recipe List</h2>
					<p class="section-subtext">
						Your saved recipes are shown below and filtered by diet preference when needed
					</p>

					<div class="note" id="filterNote" hidden></div>

					<div id="recipes" class="recipe-list"></div>

					<p class="message" id="message"></p>
				</section>
			</main>
		</div>
	</div>


<script>
let currentUser = null;
let allRecipes = [];

async function checkUser() {
	try {
		const resp = await fetch("/user");
		const data = await resp.json();

		if (!data.exists) {
			window.location.replace("/login.html");
			return false;
		}

		currentUser = data.user;
		return true;
	}
	catch (err) {
		console.error("Error checking user:", err);
		return false;
	}
}

function renderRecipes(recipes) {
	const container = document.getElementById("recipes");
	container.innerHTML = "";

	if (recipes.length === 0) {
		container.innerHTML = '<p class="empty-state">No recipes saved yet.</p>';
		return;
	}

	recipes.forEach(r => {
		const div = document.createElement("div");
		div.className = "recipe";

		div.innerHTML = `
			<h3>${r.name}</h3>
			<p><strong>Total Calories:</strong> ${Number(r.calories).toFixed(2)}</p>
			<p><strong>Diet Tag:</strong> ${r.dietTag || "None"}</p>
			<ul>
				${r.ingredients.map(i => `<li>${i.name} - ${i.quantity}${i.unit || "g"}</li>`).join("")}
			</ul>
			<button class="delete-btn" onclick="deleteRecipe(${r.id})">Delete Recipe</button>
		`;

		container.appendChild(div);
	});
}

function applyPreferenceFilter(recipes) {
	const filterNote = document.getElementById("filterNote");
	filterNote.hidden = true;
	filterNote.textContent = "";

	if (!currentUser || !currentUser.dietPreference || currentUser.dietPreference === "none")
		return recipes;

	const filtered = recipes.filter(recipe => recipe.dietTag === currentUser.dietPreference);

	filterNote.hidden = false;
	filterNote.textContent = "Showing recipes matching your diet preference: " + currentUser.dietPreference;

	return filtered;
}

async function loadRecipes() {
	try {
		const response = await fetch("/api/recipes");
		const data = await response.json();

		if (!response.ok) {
			document.getElementById("message").textContent = data.message || "Could not load recipes.";
			return;
		}

		allRecipes = Array.isArray(data) ? data : [];
		const filteredRecipes = applyPreferenceFilter(allRecipes);
		renderRecipes(filteredRecipes);
	}
	catch (err) {
		console.error("Error loading recipes:", err);
		document.getElementById("message").textContent = "Could not load recipes.";
	}
}

async function deleteRecipe(id) {
	const confirmed = confirm("Delete this recipe?");
	if (!confirmed)
		return;

	try {
		const response = await fetch("/api/recipes/" + id, {
			method: "DELETE"
		});

		const data = await response.json();

		if (response.ok) {
			document.getElementById("message").textContent = data.message;
			await loadRecipes();
		}
		else {
			document.getElementById("message").textContent = data.message || "Could not delete recipe.";
		}
	}
	catch (err) {
		console.error("Error deleting recipe:", err);
		document.getElementById("message").textContent = "Could not delete recipe.";
	}
}

async function initPage() {
	const okay = await checkUser();
	if (!okay)
		return;

	await loadRecipes();
}

initPage();
</script>
</body>
</html>
