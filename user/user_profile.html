<!DOCTYPE html>
<html>
<head>
	<title>User Profile</title>
	<link rel="stylesheet" href="userpage.css">
</head>
<body>
	<div class="container">
		<p><a href="/">Home</a></p>
		<h1><center><b>User Profile</b></center></h1>

		<form id="profileForm">
			<p>
				<label>Display Name:</label>
				<span id="displayName"></span>
				<input type="text" id="editDisplayName" hidden>
			</p>

			<p>
				<label>Username:</label>
				<span id="username"></span>
			</p>

			<p>
				<label>Email:</label>
				<span id="email"></span>
				<input type="email" id="editEmail" hidden>
			</p>

			<p>
				<label>Diet Preference:</label>
				<span id="dietPreference"></span>
				<select id="editDietPreference" hidden>
					<option value="">None</option>
					<option value="vegetarian">Vegetarian</option>
					<option value="vegan">Vegan</option>
					<option value="halal">Halal</option>
					<option value="gluten-free">Gluten-Free</option>
				</select>
			</p>

			<p id="normalButtons">
				<button type="button" id="editButton">Edit</button>
				<button type="button" id="inventoryButton">Inventory</button>
				<button type="button" id="recipesButton">Your recipes</button>
				<button type="button" id="logoutButton">Logout</button>
			</p>

			<p id="editButtons" hidden>
				<button type="submit">Save</button>
			</p>
		</form>
	</div>
	

	<script>
		let currentUser = null;

		async function loadUser() {
			try {
				const response = await fetch("/user");
				const data = await response.json();

				if (!data.exists) {
					window.location.replace("signup.html");
					return;
				}

				currentUser = data.user;

				document.getElementById("displayName").textContent = currentUser.name;
				document.getElementById("username").textContent = currentUser.username;
				document.getElementById("email").textContent = currentUser.email || "";
				document.getElementById("dietPreference").textContent = currentUser.dietPreference || "";
			}
			catch (err) {
				console.error("Error fetching user:", err);
			}
		}

		function enableEditMode() {
			document.getElementById("displayName").hidden = true;
			document.getElementById("email").hidden = true;
			document.getElementById("dietPreference").hidden = true;

			document.getElementById("editDisplayName").hidden = false;
			document.getElementById("editEmail").hidden = false;
			document.getElementById("editDietPreference").hidden = false;

			document.getElementById("editDisplayName").value = currentUser.name;
			document.getElementById("editEmail").value = currentUser.email || "";
			document.getElementById("editDietPreference").value = currentUser.dietPreference || "";

			document.getElementById("normalButtons").hidden = true;
			document.getElementById("editButtons").hidden = false;
		}

		async function saveUserChanges(event) {
			event.preventDefault();

			const updatedUser = {
				name: document.getElementById("editDisplayName").value,
				email: document.getElementById("editEmail").value,
				dietPreference: document.getElementById("editDietPreference").value
			};

			try {
				const response = await fetch("/user", {
					method: "PUT",
					headers: {
						"Content-Type": "application/json"
					},
					body: JSON.stringify(updatedUser)
				});

				const data = await response.json();

				if (response.ok) {
					currentUser = data.user;

					document.getElementById("displayName").textContent = currentUser.name;
					document.getElementById("email").textContent = currentUser.email || "";
					document.getElementById("dietPreference").textContent = currentUser.dietPreference || "";

					document.getElementById("displayName").hidden = false;
					document.getElementById("email").hidden = false;
					document.getElementById("dietPreference").hidden = false;

					document.getElementById("editDisplayName").hidden = true;
					document.getElementById("editEmail").hidden = true;
					document.getElementById("editDietPreference").hidden = true;

					document.getElementById("normalButtons").hidden = false;
					document.getElementById("editButtons").hidden = true;
				}
				else {
					console.error("Error updating user:", data.message);
				}
			}
			catch (err) {
				console.error("Error updating user:", err);
			}
		}

		document.getElementById("editButton").addEventListener("click", enableEditMode);
		document.getElementById("inventoryButton").addEventListener("click", () => {
			window.location.href = "/invpage.html";
		});
		document.getElementById("recipesButton").addEventListener("click", () => {
			window.location.href = "/recipepage.html";
		});
		document.getElementById("profileForm").addEventListener("submit", saveUserChanges);
		document.getElementById("logoutButton").addEventListener("click", async () => {
			await fetch("/logout", {method: "POST"});
			window.location.href = "/index.html";
		});

		loadUser();
	</script>
</body>
</html>
