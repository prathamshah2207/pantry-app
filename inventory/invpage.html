<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Inventory</title>
</head>
<style>
    table {
        overflow-y: scroll;
        height: 500px;
        display: block;
        margin: 0px auto;
    }
</style>

<body>

    <button>Back</button>

    <h1 style="text-align: center;">Inventory</h1>

    <br>
    <button onclick="makepopup()">Add item</button>
    <br>
    <div>
        <table id="table">
            <tr>
                <th>Amount</th>
                <th>Ingredient</th>
                <th>Calories</th>
                <th>Edit</th>
                <th>Reset</th>
                <th>Delete</th>
            </tr>
        </table>
    </div>
    <div id="popup">
        <!-- <input id="quant" placeholder="item quantity">
        <input id="name" placeholder="item name">
        <input id="cals" placeholder="item calories">
        <input id="defa" placeholder="default restock number">
        <button onclick="sendAsync()">Submit</button> -->
    </div>

<script>
    setInterval(getmsgs, 5000);

    function makepopup() {
        const popupd = document.getElementById('popup');
        popupd.innerHTML = '<input id="quant" placeholder="item quantity"><input id="name" placeholder="item name"><input id="cals" placeholder="item calories"><input id="defa" placeholder="default restock number"><button onclick="sendAsync()">Submit</button>';
    }

    function getmsgs() {
        get('/api/getmsg');
    }

    function get(url) {
        fetch(url)
            .then(res => res.json())
            .then(data => {
                const list = document.getElementById('table');
                list.innerHTML = '<tr><th>Amount</th><th>Ingredient</th><th>Calories</th><th>Edit</th><th>Reset</th><th>Delete</th></tr>';
                data.forEach(item => {
                    const li = document.createElement('tr');
                    li.innerHTML = `<td>${item.quant}</td> <td>${item.name}</td> <td>${item.cals}</td>`;
                    list.appendChild(li);
                });
            })
            .catch(error => console.error('Error fetching file:', error));
    }

    function sendAsync() {
        send('/api/sendmsg');
        document.getElementById("popup").innerHTML = '';
    }

    function send(url) {
        const quant = document.getElementById('quant').value;
        const name = document.getElementById('name').value;
        const cals = document.getElementById('cals').value;
        const defa = document.getElementById('defa').value;

        fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ quant, name, cals, defa })
        })
        .then(res => res.text())
        .then(text => {
            document.getElementById('result').innerText = text;
        })
        .catch(err => {//catch is the place where we handle failure.
            document.getElementById('result').innerText = 'Client error';
        });
    }
</script>


</body>
</html>
