<!DOCTYPE html>
<html>
<head>
	<title>Create Profile</title>
	<link rel="stylesheet" href="userpage.css">
</head>
<body>
	<div class="container">
		<h1><center><b>Create Profile</b></center></h1>

		<form id="signupForm">
			<p>
				<label>Display Name:</label>
				<input type="text" id="name" required>
			</p>

			<p>
				<label>Username:</label>
				<input type="text" id="username" required>
			</p>

			<p>
				<label>Email:</label>
				<input type="email" id="email">
			</p>

			<p>
				<label>Password:</label>
				<input type="password" id="password" required>
			</p>

			<p>
				<label>Diet Preference:</label>
				<select id="dietPreference">
					<option value="none">None</option>
					<option value="vegetarian">Vegetarian</option>
					<option value="vegan">Vegan</option>
					<option value="halal">Halal</option>
					<option value="gluten-free">Gluten-Free</option>
				</select>
			</p>

			<p>
				<label>Allow Substitutions:</label>
				<input type="checkbox" id="allowSubstitutions" checked>
			</p>

			<p>
				<button type="submit">Create Profile</button>
			</p>
		</form>
	</div>
	<p id="message"></p>

	<script>
		async function checkUser() {
			try {
				const resp = await fetch("/user");
				const data = await resp.json();
				if (data.exists)
					window.location.replace('/');
			}
			catch (err){
				console.error("Error checkin user: ", err);
			}
		}
		checkUser();

		const signupForm = document.getElementById("signupForm");
		const message = document.getElementById("message");

		signupForm.addEventListener("submit", async function(event) {
			event.preventDefault();

			const userData = {
				name: document.getElementById("name").value,
				username: document.getElementById("username").value,
				email: document.getElementById("email").value,
				password: document.getElementById("password").value,
				dietPreference: document.getElementById("dietPreference").value,
				allowSubstitutions: document.getElementById("allowSubstitutions").checked
			};

			try {
				const response = await fetch("/signup", {
					method: "POST",
					headers: {
						"Content-Type": "application/json"
					},
					body: JSON.stringify(userData)
				});

				const data = await response.json();

				if (response.ok) {
					message.textContent = data.message;
					window.location.href = "user_profile.html";
				}
				else {
					message.textContent = data.message;
				}
			}
			catch (err) {
				message.textContent = "Error creating profile.";
				console.error(err);
			}
		});
	</script>
</body>
</html>
