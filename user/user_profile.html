<!DOCTYPE html>
<html>
<head>
  <title>User Profile</title>
</head>
<body>
  <h1>User Profile</h1>
  
  <form>
    <p><label>Display Name:</label> John Doe</p>
    <p><label>Username:</label> johndoe123</p>
    <p><label>Email:</label> john@example.com</p>
    <p>
      <label for="age">Age:</label>
      <input type="number" id="age" name="age" min="0" placeholder="Enter age">
    </p>
    <p><button type="submit">Save</button></p>
  </form>
</body>
</html>
