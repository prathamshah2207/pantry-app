<!DOCTYPE html>
<html>
<head>
	<title>User Profile</title>
</head>
<body>
	<h1><center><b>User Profile</b></center></h1>

	<form id="profileForm">
		<p>
			<label>Display Name:</label>
			<span id="displayName"></span>
			<input type="text" id="editDisplayName" style="display: none;">
		</p>

		<p>
			<label>Username:</label>
			<span id="username"></span>
		</p>

		<p>
			<label>Email:</label>
			<span id="email"></span>
			<input type="email" id="editEmail" style="display: none;">
		</p>

		<p>
			<label>Diet Preference:</label>
			<span id="dietPreference"></span>
			<select id="editDietPreference" style="display: none;">
				<option value="">None</option>
				<option value="vegetarian">Vegetarian</option>
				<option value="vegan">Vegan</option>
				<option value="halal">Halal</option>
				<option value="gluten-free">Gluten-Free</option>
			</select>
		</p>

		<p id="normalButtons">
			<button type="button" id="editButton">Edit</button>
			<button type="button" id="inventoryButton">Inventory</button>
			<button type="button" id="recipesButton">Your recipes</button>
		</p>

		<p id="editButtons" style="display: none;">
			<button type="submit">Save</button>
		</p>
	</form>



	<script>
		let currentUser = null;

		async function loadUser() {
			try {
				const response = await fetch("http://localhost:3000/user");
				const data = await response.json();

				if (!data.exists) {
					window.location.href = "signup.html";
					return;
				}

				currentUser = data.user;

				document.getElementById("displayName").textContent = currentUser.name;
				document.getElementById("username").textContent = currentUser.username;
				document.getElementById("email").textContent = currentUser.email || "";
				document.getElementById("dietPreference").textContent = currentUser.dietPreference || "";
			}
			catch (err) {
				console.error("Error fetching user:", err);
			}
		}

		function enableEditMode() {
			document.getElementById("displayName").style.display = "none";
			document.getElementById("email").style.display = "none";
			document.getElementById("dietPreference").style.display = "none";

			document.getElementById("editDisplayName").style.display = "inline";
			document.getElementById("editEmail").style.display = "inline";
			document.getElementById("editDietPreference").style.display = "inline";

			document.getElementById("editDisplayName").value = currentUser.name;
			document.getElementById("editEmail").value = currentUser.email || "";
			document.getElementById("editDietPreference").value = currentUser.dietPreference || "";

			document.getElementById("normalButtons").style.display = "none";
			document.getElementById("editButtons").style.display = "block";
		}

		async function saveUserChanges(event) {
			event.preventDefault();

			const updatedUser = {
				name: document.getElementById("editDisplayName").value,
				email: document.getElementById("editEmail").value,
				dietPreference: document.getElementById("editDietPreference").value
			};

			try {
				const response = await fetch("http://localhost:3000/user", {
					method: "PUT",
					headers: {
						"Content-Type": "application/json"
					},
					body: JSON.stringify(updatedUser)
				});

				const data = await response.json();

				if (response.ok) {
					currentUser = data.user;

					document.getElementById("displayName").textContent = currentUser.name;
					document.getElementById("email").textContent = currentUser.email || "";
					document.getElementById("dietPreference").textContent = currentUser.dietPreference || "";

					document.getElementById("displayName").style.display = "inline";
					document.getElementById("email").style.display = "inline";
					document.getElementById("dietPreference").style.display = "inline";

					document.getElementById("editDisplayName").style.display = "none";
					document.getElementById("editEmail").style.display = "none";
					document.getElementById("editDietPreference").style.display = "none";

					document.getElementById("normalButtons").style.display = "block";
					document.getElementById("editButtons").style.display = "none";
				}
				else {
					console.error("Error updating user:", data.message);
				}
			}
			catch (err) {
				console.error("Error updating user:", err);
			}
		}

		document.getElementById("editButton").addEventListener("click", enableEditMode);
		document.getElementById("profileForm").addEventListener("submit", saveUserChanges);

		loadUser();
	</script>
</body>
</html>
