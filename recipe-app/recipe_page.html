<!DOCTYPE html>
<html>
<head>
<title>Recipe Tracker</title>
<link rel="stylesheet" href="recipepage.css">
</head>

<body>
	<div class="page-shell">
		<div class="app-shell">
			<header class="top-nav">
				<div class="brand">
					<h1 class="brand-title">Pantry Keeper</h1>
					<div class="brand-subtitle">Recipes • Builder • Nutrition</div>
				</div>

				<nav class="nav-links">
					<button type="button" class="nav-btn" onclick="window.location.href='recipes.html'">Saved Recipes</button>
					<button type="button" class="nav-btn" onclick="window.location.href='/'">Home</button>
				</nav>
			</header>

			<main class="content">
				<section class="hero">
					<h1>Recipe Builder</h1>
					<p>
						Create recipes, add ingredients, and calculate calories
					</p>
				</section>

				<section class="panel">
					<h2 class="section-title">Build a Recipe</h2>
					<p class="section-subtext">
						Name your recipe, choose a diet tag, add ingredients, and save it
					</p>

					<div class="form-grid">
						<div class="field-group">
							<label for="recipeName" class="field-label">Recipe Name</label>
							<input id="recipeName" placeholder="Recipe name">
						</div>

						<div class="field-group">
							<label for="dietTag" class="field-label">Diet Tag</label>
							<select id="dietTag">
								<option value="none">No Diet Tag</option>
								<option value="vegetarian">Vegetarian</option>
								<option value="vegan">Vegan</option>
								<option value="halal">Halal</option>
								<option value="gluten-free">Gluten-Free</option>
							</select>
						</div>

						<div class="field-group">
							<label for="ingredient" class="field-label">Ingredient</label>
							<select id="ingredient"></select>
						</div>

						<div class="field-group">
							<label for="qty" class="field-label">Quantity</label>
							<input id="qty" placeholder="Quantity">
						</div>
					</div>

					<div class="action-row">
						<button onclick="addIngredient()">Add Ingredient</button>
						<button onclick="calcCalories()">Calculate Calories</button>
						<button onclick="saveRecipe()">Save Recipe</button>
					</div>

					<ul id="list"></ul>

					<div class="result-box" id="result">
						Total Calories: 0
					</div>

					<p class="message" id="message"></p>
				</section>
			</main>
		</div>
	</div>


<script>
let ingredients = [];
let totalCalories = 0;
let availableIngredients = [];

async function checkUser() {
	try {
		const resp = await fetch("/user");
		const data = await resp.json();

		if (!data.exists) {
			window.location.replace("/login.html");
			return false;
		}

		return true;
	}
	catch (err) {
		console.error("Error checking user:", err);
		return false;
	}
}

async function loadIngredients() {
	try {
		const res = await fetch("/api/ingredients");
		const data = await res.json();

		if (!Array.isArray(data)) {
			throw new Error("Ingredients data is invalid");
		}

		availableIngredients = data;

		const select = document.getElementById("ingredient");
		select.innerHTML = "";

		availableIngredients.forEach((item) => {
			const option = document.createElement("option");
			option.value = item.name;
			option.textContent = item.name;
			option.dataset.cals = item.cals;
			option.dataset.unit = item.unit || "g";
			select.appendChild(option);
		});
	}
	catch (err) {
		console.error("Error loading ingredients:", err);
		document.getElementById("message").textContent = "Could not load ingredients.";
	}
}

function addIngredient() {
	const select = document.getElementById("ingredient");
	const selectedOption = select.options[select.selectedIndex];
	const name = selectedOption.value;
	const calories = parseFloat(selectedOption.dataset.cals);
	const unit = selectedOption.dataset.unit || "g";
	const quantity = parseFloat(document.getElementById("qty").value);

	if (!quantity || quantity <= 0) {
		alert("Enter valid quantity");
		return;
	}

	ingredients.push({ name, calories, quantity, unit });

	const li = document.createElement("li");
	li.innerText = name + " - " + quantity + unit;
	document.getElementById("list").appendChild(li);

	document.getElementById("qty").value = "";
	document.getElementById("message").textContent = "";
}

function calcCalories() {
	totalCalories = 0;

	ingredients.forEach(i => {
		totalCalories += i.calories * i.quantity;
	});

	document.getElementById("result").innerText =
		"Total Calories: " + totalCalories.toFixed(2);
}

async function saveRecipe() {
	const name = document.getElementById("recipeName").value.trim();
	const dietTag = document.getElementById("dietTag").value;

	if (!name) {
		alert("Enter recipe name");
		return;
	}

	if (ingredients.length === 0) {
		alert("Add at least one ingredient");
		return;
	}

	calcCalories();

	try {
		const response = await fetch("/api/recipes", {
			method: "POST",
			headers: {
				"Content-Type": "application/json"
			},
			body: JSON.stringify({
				name: name,
				ingredients: ingredients,
				calories: totalCalories,
				dietTag: dietTag
			})
		});

		const data = await response.json();

		if (response.ok) {
			document.getElementById("message").textContent = data.message;

			document.getElementById("recipeName").value = "";
			document.getElementById("dietTag").value = "";
			document.getElementById("qty").value = "";
			document.getElementById("list").innerHTML = "";
			document.getElementById("result").innerText = "Total Calories: 0";

			ingredients = [];
			totalCalories = 0;
		}
		else {
			document.getElementById("message").textContent = data.message || "Error saving recipe";
		}
	}
	catch (err) {
		console.error("Error saving recipe:", err);
		document.getElementById("message").textContent = "Error saving recipe";
	}
}

async function initPage() {
	const okay = await checkUser();
	if (!okay)
		return;

	await loadIngredients();
}

initPage();
</script>
</body>
</html>
