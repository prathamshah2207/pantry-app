<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Inventory</title>
</head>
<style>
    table {
        overflow-y: scroll;
        height: 400px;
        display: block;
        margin: 0px auto;
    }
    body {
        font-family: Arial, sans-serif;
        margin: 20;
        padding: 0;
        background-color: #f4f4f4;
        color: #222;
        text-align: left;
    }
    button {
        padding: 5px 5px;
        margin: 0px;
        border: 1px solid #999;
        border-radius: 5px;
        background-color: #eee;
        cursor: pointer;
        font-size: 15px;
    }

    button:hover {
        background-color: #ddd;
    }
</style>

<body>

    <button id="back">Back</button>

    <h1 style="text-align: center;">Inventory</h1>

    <br>
    <button onclick="makepopup()">Add item</button>
    <br>
    <div>
        <table id="table">
            <tr>
                <th>Amount</th>
                <th>/Total</th>
                <th>Ingredient</th>
                <th>Calories</th>
                <th>Edit</th>
                <th>Reset</th>
                <th>Delete</th>
            </tr>
        </table>
    </div>
    <div id="popup">
        <!-- <input id="quant" placeholder="item quantity">
        <input id="name" placeholder="item name">
        <input id="cals" placeholder="item calories">
        <input id="defa" placeholder="default restock number">
        <button onclick="sendAsync()">Submit</button> -->
    </div>

<script>

let items = [];

document.getElementById("back").addEventListener("click", () => {
    window.location.href = "/";
});

/* -----------------------
   Load inventory
----------------------- */
async function loadItems() {

    const res = await fetch('/api/getmsg');
    items = await res.json();

    renderTable();
}

async function loadIngredients() {
    const res = await fetch('/api/ingredients');
    ingredients = await res.json();
}

/* -----------------------
   Render table
----------------------- */
function renderTable() {

    const table = document.getElementById('table');

    table.innerHTML = `
        <tr>
            <th>Amount</th>
            <th>Ingredient</th>
            <th>Calories</th>
            <th>Edit</th>
            <th>Reset</th>
            <th>Delete</th>
        </tr>
    `;

    items.forEach(item => {

        const row = document.createElement('tr');

        row.innerHTML = `
            <td>${item.quant}/${item.defa} ${item.unit}</td>
            <td>${item.name}</td>
            <td>${item.cals}</td>
            <td><button onclick="openEdit(${item.id})">Edit</button></td>
            <td><button onclick="resetItem(${item.id})">Reset</button></td>
            <td><button onclick="deleteItem(${item.id})">Delete</button></td>
        `;

        table.appendChild(row);

    });

}

/* -----------------------
   Add item popup
----------------------- */
// function makepopup() {

//     const popup = document.getElementById('popup');

//     popup.innerHTML = `

//         <input id="quant" placeholder="quantity">
//         <input id="name" placeholder="name">
//         <input id="cals" placeholder="calories">
//         <input id="defa" placeholder="default restock">
//         <button onclick="addItem()">Save</button>
//         <button onclick="closePopup()">Cancel</button>
//     `;
// }

let ingredients = [];

function makepopup() {

    const popup = document.getElementById('popup');

    const options = ingredients.map((ing, i) =>
        `<option value="${i}">${ing.name}</option>`
    ).join('');

    popup.innerHTML = `
        <h3>Add Item</h3>

        <select id="ingredientSelect" onchange="updateCalories()"> ${options} </select>
        <label> Quantity: <input id="quant" type="number" min="0" placeholder="quantity"> </label>
        <label> Per restock: <input id="defa" type="number" min="0" placeholder="default restock"> </label>
        <label> Unit: <input id="unit" placeholder="unit" disabled> </label>
        <label> Calories: <input id="cals" placeholder="calories" disabled> </label>
        <button onclick="addItem()">Save</button>
        <button onclick="closePopup()">Cancel</button>
    `;

    updateCalories(); // set initial calories
}

function updateCalories() {

    const index = document.getElementById('ingredientSelect').value;

    const selected = ingredients[index];

    document.getElementById('cals').value = selected.cals;
    
    document.getElementById('unit').value = selected.unit;
}

/* -----------------------
   Edit popup
----------------------- */
function openEdit(id) {

    const item = items.find(i => i.id === id);

    const popup = document.getElementById('popup');

    popup.innerHTML = `
        <h3>Edit Item</h3>
        <label> Quantity: <input id="quant" type="number" min="0" value="${item.quant}"> </label>
        <label> Per restock: <input id="defa" type="number" min="0" value="${item.defa}"> </label>
        <label> Unit: <input id="unit" value="${item.unit}" disabled> </label>
        <label> Name: <input id="name" value="${item.name}" disabled> </label>
        <label> Calories: <input id="cals" value="${item.cals}" disabled> </label>
        <button onclick="saveEdit(${id})">Save</button>
        <button onclick="closePopup()">Cancel</button>
    `;
}

/* -----------------------
   Close popup
----------------------- */
function closePopup() {
    document.getElementById('popup').innerHTML = '';
}

/* -----------------------
   Add item
----------------------- */

async function addItem() {

    const quant = document.getElementById('quant').value;
    const defa = document.getElementById('defa').value;

    const index = document.getElementById('ingredientSelect').value;
    const selected = ingredients[index];

    const name = selected.name;
    const cals = selected.cals;
    const unit = selected.unit;

    await fetch('/api/sendmsg', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ quant, name, cals, defa, unit })
    });

    closePopup();
    loadItems();
}

/* -----------------------
   Save edit
----------------------- */
async function saveEdit(id) {

    const quant = document.getElementById('quant').value;
    const name = document.getElementById('name').value;
    const cals = document.getElementById('cals').value;
    const defa = document.getElementById('defa').value;
    const unit = document.getElementById('unit').value;

    await fetch('/api/editmsg', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id, quant, name, cals, defa, unit })
    });

    closePopup();
    loadItems();
}

/* -----------------------
   Delete item
----------------------- */
async function deleteItem(id) {

    await fetch('/api/deletemsg', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id })
    });

    loadItems();
}

/* -----------------------
   Reset quantity
----------------------- */
async function resetItem(id) {

    await fetch('/api/resetmsg', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id })
    });

    loadItems();
}

/* -----------------------
   Start page
----------------------- */
loadItems();
loadIngredients();

</script>


</body>
</html>
