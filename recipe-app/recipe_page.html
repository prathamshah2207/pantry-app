<!DOCTYPE html>
<html>
<head>
<title>Recipe Tracker</title>

<style>
body {
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(to right, #667eea, #764ba2);
    margin: 0;
}

.container {
    width: 420px;
    margin: 60px auto;
    background: white;
    padding: 30px;
    border-radius: 12px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.2);
}

h2 {
    text-align: center;
    margin-bottom: 20px;
}

input, select {
    width: 100%;
    padding: 12px;
    margin-top: 10px;
    border-radius: 8px;
    border: 1px solid #ddd;
    font-size: 14px;
}

button {
    width: 100%;
    padding: 12px;
    margin-top: 12px;
    background: #667eea;
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
    transition: 0.2s;
}

button:hover {
    background: #5a67d8;
}

ul {
    margin-top: 10px;
    padding-left: 20px;
}

li {
    margin-bottom: 5px;
}

.result-box {
    background: #f1f5f9;
    padding: 10px;
    border-radius: 8px;
    margin-top: 10px;
    text-align: center;
    font-weight: bold;
}

.nav-btn {
    background: #48bb78;
}

.nav-btn:hover {
    background: #38a169;
}
</style>
</head>

<body>

<div class="container">

<h2>🍽 Recipe Builder</h2>

<input id="recipeName" placeholder="Recipe name">

<select id="ingredient">
<option value="1.65">Chicken</option>
<option value="1.30">Rice</option>
<option value="8.8">Olive Oil</option>
<option value="1.55">Egg</option>
<option value="2.5">Beef</option>
<option value="0.34">Broccoli</option>
<option value="0.41">Carrot</option>
<option value="0.77">Potato</option>
<option value="4.02">Cheese</option>
</select>

<input id="qty" placeholder="Quantity (g)">

<button onclick="addIngredient()">Add Ingredient</button>

<ul id="list"></ul>

<button onclick="calcCalories()">Calculate Calories</button>

<div class="result-box" id="result">
Total Calories: 0
</div>

<button onclick="saveRecipe()">Save Recipe</button>

<button class="nav-btn" onclick="window.location.href='recipes.html'">
View Saved Recipes
</button>

</div>

<script>
async function checkUser() {
	try {
		const resp = await fetch("/user");
		const data = await resp.json();

		if (!data.exists) {
			window.location.replace("/login.html");
			return;
		}
	}
	catch (err) {
		console.error("Error checking user:", err);
	}
}

checkUser();

let ingredients = [];
let totalCalories = 0;

function addIngredient() {
    let select = document.getElementById("ingredient");
    let name = select.options[select.selectedIndex].text;
    let calories = parseFloat(select.value);
    let quantity = parseFloat(document.getElementById("qty").value);

    if (!quantity) {
        alert("Enter valid quantity");
        return;
    }

    ingredients.push({ name, calories, quantity });

    let li = document.createElement("li");
    li.innerText = name + " - " + quantity + "g";
    document.getElementById("list").appendChild(li);
}

function calcCalories() {
    totalCalories = 0;

    ingredients.forEach(i => {
        totalCalories += i.calories * i.quantity;
    });

    document.getElementById("result").innerText =
        "Total Calories: " + totalCalories.toFixed(2);
}

function saveRecipe() {

    let name = document.getElementById("recipeName").value;

    if (!name) {
        alert("Enter recipe name");
        return;
    }

    let recipe = {
        name: name,
        ingredients: ingredients,
        calories: totalCalories
    };

    let stored = JSON.parse(localStorage.getItem("recipes")) || [];
    stored.push(recipe);

    localStorage.setItem("recipes", JSON.stringify(stored));

    alert("Recipe saved!");
}

</script>

</body>
</html>
