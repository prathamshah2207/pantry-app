<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Inventory</title>
</head>
<style>
    table {
        overflow-y: scroll;
        height: 500px;
        display: block;
        margin: 0px auto;
    }
</style>

<body>

    <button>Back</button>

    <h1 style="text-align: center;">Inventory</h1>

    <br>
    <button>Add item</button>
    <br>
    <div>
        <table id="table">
            <tr>
                <th>Amount</th>
                <th>Ingredient</th>
                <th>Calories</th>
                <th>Edit</th>
                <th>Reset</th>
                <th>Delete</th>
            </tr>
        </table>
    </div>

<script>
    setInterval(getmsgs, 5000);

    function getmsgs() {
        get('/api/getmsg');
    }

    function get(url) {
        fetch(url)
            .then(res => res.json())
            .then(data => {
                const list = document.getElementById('table');
                list.innerHTML = '<tr><th>Amount</th><th>Ingredient</th><th>Calories</th><th>Edit</th><th>Reset</th><th>Delete</th></tr>';
                data.forEach(item => {
                    const li = document.createElement('tr');
                    li.innerHTML = `<td>${item.topic}</td> <td>${item.message}</td> <td>${item.date}</td>`;
                    list.appendChild(li);
                });
            })
            .catch(error => console.error('Error fetching file:', error));
    }
</script>


</body>
</html>
